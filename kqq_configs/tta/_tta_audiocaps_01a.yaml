---
clip_duration: 10.

train_jsonls:
  - path: "./jsonls/tta/train/audiocaps2.0.jsonl" 
    weight: 1.0

validate_train_jsonl:
    path: "./jsonls/tta/train/audiocaps2.0.jsonl"
    num: 10

validate_test_jsonl:
    path: "./jsonls/tta/test/audiocaps2.0.jsonl"
    num: 10

sampler: 
    name: BatchJsonlSampler

dataset: 
    name: TTADataset


vae:
    name: "levo_vae"
    dim: &vae_dim 64


model:
    dim: &dim 768

    in:
        in_dim: *vae_dim
        dim: *dim

    base:
        name: Transformer
        dim: *dim
        num_layers: 12
        num_heads: 24
        rope_len: 8192

    out:
        dim: *dim
        out_dim: *vae_dim

    adapter:
        name: TTAAdapter
        dim: *dim

flow:
    matcher: 
        name: "linear"
    
    schedule:
        name: "uniform"  # "uniform" | "logitnormal"
        # mu: -1.2
        # sigma: 1.0

cfg:
    train:
        p_full: 0.1
        p_partial: 0.1
    sample:
        scale: 4.0

train:
    device: cuda
    num_workers: 16
    precision: "no"  # "no" (fp32) | "bf16"
    optimizer: AdamW
    lr: 1e-4
    warm_up_steps: 1000  # Leave blank if no warm up is used
    batch_size_per_device: 8
    test_every_n_steps: 10000
    save_every_n_steps: 100000
    training_steps: 2000000
    resume_ckpt_path:  # Leave blank if train from scratch

